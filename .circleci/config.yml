version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.2.3
  aws-s3: circleci/aws-s3@4.1.3
# Define the AWS account ID as an environment variable
environment: &default_environment
  AWS_ACCOUNT_ID: "100828517052"

jobs:
  deploy:
    docker:
      - image: cimg/node:20.12
    environment:
      <<: *default_environment
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build static site
          command: npm run build
      - aws-cli/setup:
          profile_name: OIDC-User
          role_arn: 'arn:aws:iam::${AWS_ACCOUNT_ID}:role/circleci-oidc-role'
          role_session_name: "fe-deploy-production"
      - aws-s3/sync:
          arguments: --delete
          from: out
          profile_name: OIDC-User
          to: s3://text-behind-video.io
      - run:
          name: Invalidate CloudFront cache
          command: aws cloudfront create-invalidation --distribution-id EBT4WHC4G5PZH --paths '/*' --profile OIDC-User

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - deploy:
          context: ai-social-auth
          filters:
            branches:
              only:
                - master